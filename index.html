<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Treino e Dieta</title>
  
  <!-- FAVICON: compatível com desktop e iOS/Safari -->
  <link rel="icon" href="favicon.png?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=4">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=4">
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=4">
  <link rel="apple-touch-icon" href="favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="152x152" href="favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="120x120" href="favicon.png?v=4">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino e Dieta">
  <meta name="theme-color" content="#050505">

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .arch-card {
      background: rgba(18, 18, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.9);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .arch-card-hover:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .chip-highlight {
      background: rgba(30, 30, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .chip-sets {
      background: rgba(10, 35, 15, 0.9);
      border: 1px solid rgba(34, 197, 94, 0.8);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.25);
      color: #86efac;
    }
    .chip-alert {
      background: rgba(60, 10, 15, 0.95);
      border: 1px solid rgba(244, 63, 94, 0.9);
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.4);
      color: #fecdd3;
      animation: alertPulse 1.8s infinite;
    }
    .chip-warning {
      background: rgba(50, 30, 5, 0.95);
      border: 1px solid rgba(251, 146, 60, 0.9);
      box-shadow: 0 0 12px rgba(251, 146, 60, 0.35);
      color: #fed7aa;
      animation: alertPulse 2.5s infinite;
    }
    /* card inteiro muda de borda conforme urgência */
    .card-warning {
      border-color: rgba(251, 146, 60, 0.5) !important;
      box-shadow: 0 0 18px rgba(251, 146, 60, 0.15) !important;
    }
    .card-alert {
      border-color: rgba(244, 63, 94, 0.6) !important;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.2) !important;
    }
    .chip-success {
      background: rgba(10, 35, 20, 0.9);
      border: 1px solid rgba(34, 197, 94, 0.8);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.25);
      color: #86efac;
    }

    .day-active {
      background: #ffffff !important;
      color: #000000 !important;
      font-weight: 900 !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.35) !important;
    }

    @keyframes alertPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.96); }
    }

    .led-line {
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
    }

    .tab-fade-enter {
      animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-zinc-100 min-h-screen pb-28 antialiased selection:bg-white selection:text-black" x-data="appData()" x-init="initApp(); checkAutoReset()">

  <!-- Banner notificações -->
  <div id="notif-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-zinc-900 border-b border-zinc-700 px-4 py-3 flex items-center justify-between gap-3">
    <p class="text-xs text-zinc-300 font-mono">Ativar lembretes de refeição?</p>
    <div class="flex gap-2 shrink-0">
      <button onclick="document.getElementById('notif-banner').remove()" class="text-[10px] font-mono text-zinc-500 hover:text-zinc-300 px-2 py-1">Não</button>
      <button onclick="solicitarNotificacoes().then(ok => { if(ok){ document.getElementById('notif-banner').remove(); const d=JSON.parse(localStorage.getItem('my_dieta_v5')||'[]'); agendarNotificacoes(d); } })" 
              class="text-[10px] font-mono font-bold bg-white text-black px-3 py-1 rounded-lg active:scale-95">Ativar</button>
    </div>
  </div>

  <!-- Barra Superior -->
  <header class="sticky top-0 z-30 bg-black/80 backdrop-blur-xl border-b border-zinc-800/80 px-4 py-3">
    <div class="max-w-md md:max-w-2xl lg:max-w-4xl mx-auto flex items-center justify-center">
      <button @click="resetDayManual()" class="text-[10px] font-mono font-bold bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-zinc-200 px-4 py-1.5 rounded-lg border border-zinc-700 transition-all duration-150 flex items-center gap-1.5 shadow-sm">
        Reset Manual
      </button>
    </div>
  </header>

  <main class="p-4 max-w-md md:max-w-2xl lg:max-w-4xl mx-auto space-y-5">
    
    <!-- CARD HIDRATAÇÃO -->
    <section class="p-4 sm:p-5 rounded-2xl arch-card space-y-3 relative overflow-hidden">
      <div class="flex justify-between items-center">
        <div>
          <span class="text-[9px] font-mono font-bold tracking-widest text-zinc-400 uppercase">Hidratação</span>
          <h3 class="text-sm sm:text-base font-extrabold text-white">Meta: 4.5L / dia</h3>
        </div>
        <span class="text-xs font-mono font-black chip-highlight px-3 py-1 rounded-md"
              x-text="`${(garrafasBebeidas * 1.5).toFixed(1)}L / 4.5L`"></span>
      </div>

      <div class="w-full bg-zinc-900 rounded-full h-2 border border-zinc-800 overflow-hidden">
        <div class="bg-sky-400 h-full transition-all duration-500 shadow-[0_0_10px_rgba(56,189,248,0.5)]"
             :style="`width: ${Math.min((garrafasBebeidas / 3) * 100, 100)}%`"></div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button @click="removerAgua()" 
                class="p-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white font-mono font-bold text-xs active:scale-95 transition">
          - 1.5L
        </button>
        <button @click="adicionarAgua()" 
                class="p-2 rounded-xl bg-white text-black font-mono font-black text-xs active:scale-95 transition shadow-[0_0_12px_rgba(255,255,255,0.2)]">
          + 1.5L
        </button>
      </div>
    </section>

    <!-- TAB DIETA -->
    <template x-if="tab === 'dieta'">
      <div class="space-y-4 tab-fade-enter">
        <div class="p-4 rounded-2xl arch-card space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-[9px] font-mono font-bold tracking-widest text-zinc-400 uppercase">Nutrição // Cronograma</span>
            <span class="text-xs font-mono font-black chip-highlight px-3 py-0.5 rounded-md" 
                  x-text="`${dieta.filter(i => i.concluido).length}/${dieta.length} DONE`"></span>
          </div>
          <div class="w-full bg-zinc-900 rounded-full h-1.5 border border-zinc-800 overflow-hidden">
            <div class="bg-white h-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(255,255,255,0.8)]"
                 :style="`width: ${(dieta.filter(i => i.concluido).length / dieta.length) * 100}%`"></div>
          </div>

          <!-- Macros consumidos hoje -->
          <div class="pt-2 border-t border-zinc-800/80 space-y-2">
            <span class="text-[9px] font-mono font-bold tracking-widest text-zinc-400 uppercase">Consumido hoje</span>
            <div class="grid grid-cols-2 gap-3">
              <template x-for="macro in getMacrosConsumidos()" :key="macro.label">
                <div class="p-2.5 bg-zinc-950/80 rounded-xl border border-zinc-800 space-y-1.5">
                  <div class="flex justify-between items-baseline gap-1">
                    <span class="text-[8px] font-mono text-zinc-500 uppercase" x-text="macro.label"></span>
                    <span class="text-sm font-mono font-black transition-all duration-300"
                          :class="macro.pct >= 100 ? 'text-green-400' : 'text-white'"
                          x-text="macro.display"></span>
                  </div>
                  <div class="w-full bg-zinc-900 rounded-full h-1 overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-500"
                         :style="`width: ${Math.min(macro.pct, 100)}%; background: ${macro.pct >= 100 ? '#4ade80' : macro.pct >= 70 ? '#fb923c' : '#52525b'}`"></div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <template x-for="(ref, index) in dieta" :key="index">
            <div class="p-4 rounded-2xl arch-card arch-card-hover transition-all duration-300 flex flex-col justify-between" 
                 :class="ref.concluido ? 'opacity-35 bg-zinc-950/40 border-zinc-900 scale-[0.99]' : ''">
              <label class="flex items-start gap-3.5 cursor-pointer">
                <input type="checkbox" x-model="ref.concluido" @change="save()" 
                       class="mt-1 w-4 h-4 accent-white bg-zinc-950 border-zinc-700 rounded cursor-pointer shrink-0 transition-transform active:scale-90">
                <div class="flex-1 min-w-0 space-y-2">
                  <div class="flex justify-between items-center gap-2">
                    <span class="font-extrabold text-xs sm:text-sm text-white tracking-tight transition-all duration-200" :class="ref.concluido ? 'line-through text-zinc-500' : ''" x-text="ref.nome"></span>
                    <span class="text-[10px] font-mono font-extrabold px-2.5 py-0.5 rounded-md shrink-0 transition-all"
                          :class="ref.concluido ? 'chip-success' : 
                                 (isAtrasado(ref.horario) ? 'chip-alert' : 'chip-highlight')" 
                          x-text="ref.concluido ? 'CONCLUÍDO' : (isAtrasado(ref.horario) ? `ATRASADO (${ref.horario})` : ref.horario)"></span>
                  </div>

                  <!-- Barra aparece só 30 min antes, some no horário exato -->
                  <template x-if="!ref.concluido && mostrarBarra(ref.horario)">
                    <div class="w-full bg-zinc-900 rounded-full h-1 overflow-hidden">
                      <div class="h-full rounded-full transition-all duration-1000"
                           :style="`width: ${getProgresso(ref.horario)}%; background: ${getProgressoCor(ref.horario)}`"></div>
                    </div>
                  </template>
                  
                  <p class="text-xs text-zinc-300 font-medium leading-relaxed" x-text="ref.itens"></p>
                  
                  <template x-if="ref.obs">
                    <div class="border-l-2 border-zinc-400 pl-2 py-0.5 mt-2">
                      <p class="text-[10px] text-zinc-400 font-mono italic" x-text="ref.obs"></p>
                    </div>
                  </template>
                </div>
              </label>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- TAB TREINO -->
    <template x-if="tab === 'treino'">
      <div class="space-y-4 tab-fade-enter">
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
          <template x-for="(t, idx) in treinos" :key="idx">
            <button @click="setTreino(idx)" 
                    :class="activeTreino === idx ? 'day-active scale-[1.02]' : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:border-zinc-700'"
                    class="px-4 py-2 rounded-xl text-xs font-mono uppercase tracking-wider whitespace-nowrap border transition-all duration-200 active:scale-95">
              <span x-text="t.dia"></span>
            </button>
          </template>
        </div>

        <!-- Tela de descanso (fim de semana ou activeTreino = -1) -->
        <template x-if="activeTreino === -1">
          <div class="p-8 rounded-2xl arch-card flex flex-col items-center justify-center gap-3 text-center">
            <span class="text-4xl">🛌</span>
            <h3 class="text-sm font-black text-white tracking-wide">Dia de Descanso</h3>
            <p class="text-xs text-zinc-400 font-mono">Recuperação é parte do treino.</p>
            <p class="text-[10px] text-zinc-600 font-mono">Selecione um dia acima para ver os exercícios.</p>
          </div>
        </template>

        <!-- Conteúdo do treino (só quando dia de semana selecionado) -->
        <template x-if="activeTreino >= 0">
          <div class="space-y-4">
        <div class="p-3.5 rounded-xl bg-zinc-900/90 border-l-4 border-green-500 text-zinc-300 text-xs leading-relaxed space-y-1">
          <span class="font-mono font-black uppercase text-[9px] text-green-400 block tracking-widest">Aviso de Aquecimento</span>
          <p>Realize 1 a 2 séries leves com carga reduzida no primeiro exercício antes da carga de trabalho.</p>
        </div>

        <div class="p-4 rounded-2xl arch-card flex justify-between items-center">
          <div>
            <span class="text-[9px] font-mono font-bold tracking-widest text-zinc-400 uppercase">Sessão Ativa</span>
            <h3 class="text-sm sm:text-base font-black text-green-400 tracking-wide" x-text="treinos[activeTreino].foco"></h3>
          </div>
          <span class="text-xs font-mono font-black chip-highlight px-3 py-1 rounded-md" x-text="`${treinos[activeTreino].exercicios.filter(e => e.concluido).length}/${treinos[activeTreino].exercicios.length}`"></span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <template x-for="(ex, index) in treinos[activeTreino].exercicios" :key="index">
            <div class="p-4 rounded-2xl arch-card arch-card-hover transition-all duration-300 flex flex-col justify-between" 
                 :class="ex.concluido ? 'opacity-35 bg-zinc-950/40 border-zinc-900 scale-[0.99]' : ''">
              <div class="flex items-start gap-3.5">
                <input type="checkbox" x-model="ex.concluido" @change="save()" 
                       class="mt-1 w-4 h-4 accent-white bg-zinc-950 border-zinc-700 rounded cursor-pointer shrink-0 transition-transform active:scale-90">
                <div class="flex-1 space-y-3 min-w-0">
                  <div class="flex justify-between items-start gap-2">
                    <span class="font-bold text-xs sm:text-sm text-white leading-tight transition-all duration-200" :class="ex.concluido ? 'line-through text-zinc-500' : ''" x-text="ex.nome"></span>
                    <div class="flex flex-col items-end gap-1 shrink-0">
                      <span class="text-[10px] font-mono font-extrabold chip-sets px-2 py-0.5 rounded" x-text="`${ex.series} sets × ${ex.reps}`"></span>
                      <span class="text-[9px] font-mono text-zinc-400" x-text="`REST: ${ex.descanso}`"></span>
                    </div>
                  </div>
                  
                  <div class="space-y-2 pt-2 border-t border-zinc-800">
                    <!-- Carga com botões + e - -->
                    <div>
                      <div class="flex items-center justify-between mb-0.5">
                        <label class="text-[8px] font-mono font-bold uppercase tracking-widest text-zinc-400">Carga</label>
                        <!-- Indicador de evolução -->
                        <template x-if="getCargaAnterior(activeTreino, index)">
                          <span class="text-[8px] font-mono"
                                :class="getCargaNum(ex.carga) > getCargaNum(getCargaAnterior(activeTreino, index)) ? 'text-green-400' : (getCargaNum(ex.carga) < getCargaNum(getCargaAnterior(activeTreino, index)) ? 'text-red-400' : 'text-zinc-500')"
                                x-text="getCargaNum(ex.carga) > getCargaNum(getCargaAnterior(activeTreino, index)) ? '↑ ' + getCargaAnterior(activeTreino, index) : (getCargaNum(ex.carga) < getCargaNum(getCargaAnterior(activeTreino, index)) ? '↓ ' + getCargaAnterior(activeTreino, index) : '= ' + getCargaAnterior(activeTreino, index))"></span>
                        </template>
                      </div>
                      <div class="flex items-center gap-1">
                        <button @click="decrementarCarga(ex)" class="bg-zinc-900 border border-zinc-700 text-zinc-300 rounded-lg px-2.5 py-1 text-xs font-mono font-bold active:scale-95 transition shrink-0">−</button>
                        <input type="text" inputmode="decimal" x-model="ex.carga" @change="save()" :placeholder="getCargaAnterior(activeTreino, index) || '0kg'"
                               class="bg-zinc-950 border border-zinc-700 focus:border-green-400 rounded-lg px-2 py-1 w-full text-xs text-green-300 font-bold placeholder-zinc-600 focus:outline-none font-mono text-center transition-colors duration-150">
                        <button @click="incrementarCarga(ex)" class="bg-zinc-900 border border-zinc-700 text-zinc-300 rounded-lg px-2.5 py-1 text-xs font-mono font-bold active:scale-95 transition shrink-0">+</button>
                      </div>
                    </div>
                    <!-- Gráfico de evolução de carga -->
                    <template x-if="getHistoricoGrafico(activeTreino, index).length > 1">
                      <div class="pt-1">
                        <span class="text-[8px] font-mono text-zinc-500 uppercase tracking-widest">Evolução</span>
                        <svg class="w-full mt-1" height="32" :viewBox="`0 0 ${getHistoricoGrafico(activeTreino, index).length * 20} 32`" preserveAspectRatio="none">
                          <polyline
                            :points="getGraficoPontos(activeTreino, index)"
                            fill="none"
                            :stroke="getGraficoCor(activeTreino, index)"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          />
                          <template x-for="(pt, pi) in getGraficoPontosArray(activeTreino, index)" :key="pi">
                            <circle :cx="pt.x" :cy="pt.y" r="2" :fill="getGraficoCor(activeTreino, index)"/>
                          </template>
                        </svg>
                        <div class="flex justify-between mt-0.5">
                          <span class="text-[7px] font-mono text-zinc-600" x-text="getHistoricoGrafico(activeTreino, index)[0].carga"></span>
                          <span class="text-[7px] font-mono text-zinc-400 font-bold" x-text="getHistoricoGrafico(activeTreino, index).slice(-1)[0].carga"></span>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
          </div>
        </template>
      </div>
    </template>

    <!-- TAB GUIA E COMPRAS -->
    <template x-if="tab === 'guia'">
      <div class="space-y-4 tab-fade-enter">
        <div class="p-4 rounded-2xl arch-card space-y-3">
          <span class="text-[9px] font-mono font-bold uppercase tracking-widest text-zinc-400">Nutrição // Metas</span>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
            <div class="p-2 bg-zinc-950 rounded-xl border border-zinc-800">
              <span class="text-[8px] font-mono text-zinc-400 block uppercase">Calorias</span>
              <span class="text-xs font-mono font-black text-white">3430 kcal</span>
            </div>
            <div class="p-2 bg-zinc-950 rounded-xl border border-zinc-800">
              <span class="text-[8px] font-mono text-zinc-400 block uppercase">Proteínas</span>
              <span class="text-xs font-mono font-black text-white">164g</span>
            </div>
            <div class="p-2 bg-zinc-950 rounded-xl border border-zinc-800">
              <span class="text-[8px] font-mono text-zinc-400 block uppercase">Carbos</span>
              <span class="text-xs font-mono font-black text-white">482g</span>
            </div>
            <div class="p-2 bg-zinc-950 rounded-xl border border-zinc-800">
              <span class="text-[8px] font-mono text-zinc-400 block uppercase">Gorduras</span>
              <span class="text-xs font-mono font-black text-white">90g</span>
            </div>
          </div>
          <p class="text-xs font-mono text-zinc-300 text-center pt-1">Meta de Peso: 55kg → 73kg</p>
        </div>

        <div class="p-4 rounded-2xl arch-card space-y-3">
          <h3 class="text-xs font-mono font-black uppercase tracking-wider text-white">Lista de Compras (7 Dias)</h3>
          
          <div class="space-y-3 text-xs text-zinc-300 font-medium">
            <div class="border-l border-zinc-700 pl-2.5">
              <span class="text-[9px] font-mono font-bold text-zinc-400 block uppercase">Proteínas & Perecíveis</span>
              <ul class="list-disc list-inside space-y-0.5 mt-1">
                <li>1.4 kg Peito de frango cru</li>
                <li>2 cartelas de ovos (35 unidades/semana)</li>
              </ul>
            </div>

            <div class="border-l border-zinc-700 pl-2.5">
              <span class="text-[9px] font-mono font-bold text-zinc-400 block uppercase">Carboidratos & Hortifruti</span>
              <ul class="list-disc list-inside space-y-0.5 mt-1">
                <li>1.1 kg Arroz branco cru</li>
                <li>500 g Aveia em flocos</li>
                <li>350 g Farinha de arroz</li>
                <li>5 Litros de Leite integral</li>
                <li>2 a 3 palmas de banana (~19 unidades)</li>
                <li>560 g Brócolis fresco (ou 2 pacotes congelados 280g)</li>
              </ul>
            </div>

            <div class="border-l border-zinc-700 pl-2.5">
              <span class="text-[9px] font-mono font-bold text-zinc-400 block uppercase">Suplementos & Estoque</span>
              <ul class="list-disc list-inside space-y-0.5 mt-1">
                <li>2 pacotes de Pão de forma</li>
                <li>1/4 de pote de Pasta de amendoim (~250g)</li>
                <li>Azeite de Oliva Extravirgem</li>
                <li>Creatina 250g</li>
                <li>Hipercalórico Anabolic Mass 3kg</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="p-4 rounded-2xl arch-card space-y-2 text-xs text-zinc-300 leading-relaxed font-medium">
          <h3 class="text-xs font-mono font-black uppercase tracking-wider text-white">Diretrizes Táticas</h3>

          const start = new Date(fim.getTime() - 30 * 60000);

          return Math.min(100, Math.max(0, (elapsed / total) * 100));

        save() {

          // Salva histórico de cargas com data
          this.salvarHistorico();
        },
        salvarHistorico() {
          const hoje = new Date().toDateString();
          const hist = JSON.parse(localStorage.getItem('my_hist_cargas') || '{}');
          this.treinos.forEach((treino, ti) => {
            treino.exercicios.forEach((ex, ei) => {
              if (ex.carga) {
                if (!hist[ti]) hist[ti] = {};
                if (!hist[ti][ei]) hist[ti][ei] = [];
                // Atualiza ou adiciona entrada de hoje
                const idx = hist[ti][ei].findIndex(h => h.data === hoje);
                if (idx >= 0) hist[ti][ei][idx].carga = ex.carga;
                else hist[ti][ei].push({ data: hoje, carga: ex.carga });
                // Mantém só últimas 30 entradas
                if (hist[ti][ei].length > 30) hist[ti][ei].shift();
              }
            });
          });
          localStorage.setItem('my_hist_cargas', JSON.stringify(hist));
        },
        // Retorna carga da sessão anterior (diferente de hoje)
        getCargaAnterior(ti, ei) {
          const hoje = new Date().toDateString();
          const hist = JSON.parse(localStorage.getItem('my_hist_cargas') || '{}');
          const entries = hist[ti] && hist[ti][ei] ? hist[ti][ei] : [];
          const anterior = [...entries].reverse().find(h => h.data !== hoje);
          return anterior ? anterior.carga : null;
        },
        getCargaNum(cargaStr) {
          if (!cargaStr) return 0;
          return parseFloat(String(cargaStr).replace(/[^\d.]/g, '')) || 0;
        },
        incrementarCarga(ex) {
          const num = this.getCargaNum(ex.carga);
          const step = num < 10 ? 1 : num < 50 ? 2.5 : 5;
          ex.carga = (num + step) + 'kg';
          this.save();
        },
        decrementarCarga(ex) {
          const num = this.getCargaNum(ex.carga);
          const step = num <= 10 ? 1 : num <= 50 ? 2.5 : 5;
          const novo = Math.max(0, num - step);
          ex.carga = novo + 'kg';
          this.save();
        },
        // Retorna últimas 7 entradas do histórico para o gráfico, preenchendo dias vazios com ponto neutro
        getHistoricoGrafico(ti, ei) {
          const hist = JSON.parse(localStorage.getItem('my_hist_cargas') || '{}');
          const entries = hist[ti] && hist[ti][ei] ? [...hist[ti][ei]] : [];
          if (entries.length === 0) return [];
          // Preenche dias sem registro entre o primeiro e hoje com a última carga conhecida
          const hoje = new Date();
          const result = [];
          let ultimaCarga = entries[0].carga;
          // Pega os últimos 7 dias úteis (seg-sex)
          const diasUteis = [];
          for (let i = 13; i >= 0 && diasUteis.length < 7; i--) {
            const d = new Date(hoje);
            d.setDate(hoje.getDate() - i);
            const dow = d.getDay();
            if (dow >= 1 && dow <= 5) diasUteis.push(d.toDateString());
          }
          diasUteis.forEach(dataStr => {
            const entry = entries.find(e => e.data === dataStr);
            if (entry) {
              ultimaCarga = entry.carga;
              result.push({ data: dataStr, carga: entry.carga, neutro: false });
            } else if (result.length > 0) {
              result.push({ data: dataStr, carga: ultimaCarga, neutro: true });
            }
          });
          return result.slice(-7);
        },
        getGraficoPontosArray(ti, ei) {
          const dados = this.getHistoricoGrafico(ti, ei);
          if (dados.length < 2) return [];
          const valores = dados.map(d => this.getCargaNum(d.carga));
          const min = Math.min(...valores);
          const max = Math.max(...valores);
          const range = max - min || 1;
          const w = 20;
          const h = 32;
          const pad = 4;
          return valores.map((v, i) => ({
            x: i * w + w / 2,
            y: h - pad - ((v - min) / range) * (h - pad * 2)
          }));
        },
        getGraficoPontos(ti, ei) {
          return this.getGraficoPontosArray(ti, ei).map(p => `${p.x},${p.y}`).join(' ');
        },
        getGraficoCor(ti, ei) {
          const dados = this.getHistoricoGrafico(ti, ei);
          if (dados.length < 2) return '#52525b';
          // Compara primeiro registro real com último registro real
          const reais = dados.filter(d => !d.neutro);
          if (reais.length < 2) return '#71717a';
          const primeiro = this.getCargaNum(reais[0].carga);
          const ultimo   = this.getCargaNum(reais[reais.length - 1].carga);
          if (ultimo > primeiro) return '#4ade80';
          if (ultimo < primeiro) return '#f87171';
          return '#71717a';
        },
        executeReset(resetNotes = false) {
          this.dieta.forEach(item => item.concluido = false);
          this.treinos.forEach(t => t.exercicios.forEach(e => {

              e.notas = '';
            }
          }));
          this.garrafasBebeidas = 0;
          this.save();
        },
        resetDayManual() {
          this.executeReset(false);
        }

    // ── PWA + Notificações ──────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW erro:', e));
    }

    async function solicitarNotificacoes() {
      if (!('Notification' in window)) {
        alert('Seu navegador não suporta notificações.');
        return false;
      }
      const perm = await Notification.requestPermission();
      return perm === 'granted';
    }

    // Remove numeração: "1. Café da Manhã" → "Café da Manhã"
    function nomeLimpo(nome) {
      return nome.replace(/^\d+\.\s*/, '');
    }

    // Verifica se refeição já foi concluída no momento do disparo
    function jaFez(horario) {
      const atual = JSON.parse(localStorage.getItem('my_dieta_v5') || '[]');
      const item = atual.find(i => i.horario === horario);
      return item && item.concluido;
    }

    // Agrupa refeições com horários a menos de 15 min de diferença
    function agrupar(lista) {
      const grupos = [];
      const usados = new Set();
      lista.forEach((ref, i) => {
        if (usados.has(i)) return;
        const [h1, m1] = ref.horario.split(':').map(Number);
        const grupo = [ref];
        usados.add(i);
        lista.forEach((ref2, j) => {
          if (usados.has(j)) return;
          const [h2, m2] = ref2.horario.split(':').map(Number);
          const diff = Math.abs((h1 * 60 + m1) - (h2 * 60 + m2));
          if (diff <= 15) { grupo.push(ref2); usados.add(j); }
        });
        grupos.push(grupo);
      });
      return grupos;
    }

    function enviarAgendaParaSW(dieta) {
      if (!dieta || !dieta.length) return;
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.ready.then(reg => {
        reg.active?.postMessage({ type: 'SCHEDULE_NOTIFICATIONS', refeicoes: dieta });
      }).catch(e => console.warn('SW agenda erro:', e));
    }

    // Agenda notificações: delega ao SW quando disponível, senão usa setTimeout local
    function agendarNotificacoes(dieta) {
      if (!dieta || !dieta.length) return;
      if (typeof Notification === 'undefined') return;
      if (Notification.permission !== 'granted') return;

      enviarAgendaParaSW(dieta);

      const pendentes = dieta.filter(r => !r.concluido);
      const grupos = agrupar(pendentes);

      grupos.forEach(grupo => {
        const primeiro = grupo[0];
        const [h, m] = primeiro.horario.split(':').map(Number);

        const titulo = grupo.length > 1
          ? grupo.map(r => nomeLimpo(r.nome)).join(' + ')
          : nomeLimpo(primeiro.nome);

        const corpo = grupo.map(r => r.itens).join(' | ');

        const aviso15 = new Date();
        aviso15.setHours(h, m - 15, 0, 0);
        const ms15 = aviso15 - new Date();
        if (ms15 > 0) {
          setTimeout(() => {
            if (grupo.some(r => !jaFez(r.horario))) {
              try {
                new Notification(titulo + ' às ' + primeiro.horario, {
                  body: corpo,
                  icon: 'favicon.png',
                  tag: 'aviso-' + primeiro.horario
                });
              } catch(e) { console.warn('Notif erro:', e); }
            }
          }, ms15);
        }

        const avisoExato = new Date();
        avisoExato.setHours(h, m, 0, 0);
        const msExato = avisoExato - new Date();
        if (msExato > 0) {
          setTimeout(() => {
            if (grupo.some(r => !jaFez(r.horario))) {
              try {
                new Notification('Hora de comer — ' + titulo, {
                  body: corpo,
                  icon: 'favicon.png',
                  tag: 'hora-' + primeiro.horario,
                  requireInteraction: true
                });
              } catch(e) { console.warn('Notif erro:', e); }
            }
          }, msExato);
        }
      });
    }

    // Inicializa após Alpine carregar (window.load é mais seguro que DOMContentLoaded com Alpine)
    window.addEventListener('load', () => {
      if (typeof Notification === 'undefined') return;
      if (Notification.permission === 'granted') {
        const dados = JSON.parse(localStorage.getItem('my_dieta_v5') || '[]');
        if (dados.length) agendarNotificacoes(dados);
      } else if (Notification.permission !== 'denied') {
        const banner = document.getElementById('notif-banner');
        if (banner) banner.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
